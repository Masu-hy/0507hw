<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT - 建立帳戶</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="logo">
    ChatGPT
  </div>
</header>

<div class="signup-container">
  <h1 class="form-title">建立帳戶</h1>

  <form class="signup-form">
    <label for="email">電子郵件地址</label>
    <input type="email" id="email" class="input-field" placeholder="" required>

    <button type="submit" class="continue-btn">繼續</button>
  </form>

  <div class="login-link">
    已擁有帳戶？<a href="index.html">登入</a>
  </div>

  <div class="divider">
    <span>或</span>
  </div>

  <div class="social-login">
    <button class="social-btn">
      <img src="google.png" alt="Google">
      使用 Google 帳戶繼續
    </button>

    <button class="social-btn">
      <img src="Micro.png" alt="Microsoft">
      使用 Microsoft 帳戶繼續
    </button>

    <button class="social-btn">
      <img src="apple_logo.jpg" alt="Apple">
      使用 Apple 帳戶繼續
    </button>
  </div>

  <div class="footer-links">
    <a href="#">使用條款</a>
    <span>|</span>
    <a href="#">隱私權政策</a>
  </div>
</div>

<script src="signup-script.js"></script>
</body>
</html>
