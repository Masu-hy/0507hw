<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT - 建立帳戶</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="header">
  <div class="logo">
    ChatGPT
  </div>
</header>

<div class="signup-container">
  <h1 class="form-title">建立帳戶</h1>

  <!-- 註冊表單 -->
  <form class="signup-form" id="signupForm">
    <div class="form-group">
      <label for="email">電子郵件地址</label>
      <input type="email" id="email" class="input-field" placeholder="your@email.com" required>
      <div class="error-message" id="emailError"></div>
    </div>

    <div class="form-group">
      <label for="password">密碼</label>
      <div class="password-field">
        <input type="password" id="password" class="input-field" placeholder="至少8個字符" required>
        <button type="button" class="toggle-password" id="togglePassword">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
      <div class="error-message" id="passwordError"></div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">確認密碼</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" class="input-field" placeholder="再次輸入密碼" required>
        <button type="button" class="toggle-password" id="toggleConfirmPassword">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
      <div class="error-message" id="confirmPasswordError"></div>
    </div>

    <button type="submit" class="continue-btn">註冊</button>
  </form>

  <!-- 釣魚網站警告 -->
  <div id="signupSuccess" class="phishing-warning" style="display: none;">
    <div class="warning-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2>這是釣魚網站，您已上當！</h2>
    <h3>請多加留意網路資安風險</h3>
    <h3>不要在不明網站輸入個人資料</h3>
    <div class="security-tips">
      <h3>網路安全提示：</h3>
      <ul>
        <li>確認網址是否為官方網站</li>
        <li>檢查網站是否使用HTTPS安全連接</li>
        <li>不要點擊來路不明的連結</li>
        <li>不要在陌生網站輸入個人資料</li>
      </ul>
      <button id="backToHomeBtn" class="back-to-home-btn">了解，返回首頁</button>
    </div>
  </div>

  <div class="login-link">
    已擁有帳戶？<a href="login.html">登入</a>
  </div>

  <div class="divider">
    <span>或</span>
  </div>

  <div class="social-login">
    <button type="button" class="social-btn" id="googleLogin">
      <img src="google.png" alt="Google">
      使用 Google 帳戶繼續
    </button>

    <button type="button" class="social-btn" id="microsoftLogin">
      <img src="Micro.png" alt="Microsoft">
      使用 Microsoft 帳戶繼續
    </button>

    <button type="button" class="social-btn" id="appleLogin">
      <img src="apple_logo.jpg" alt="Apple">
      使用 Apple 帳戶繼續
    </button>
  </div>

  <div class="footer-links">
    <a href="#">使用條款</a>
    <span>|</span>
    <a href="#">隱私權政策</a>
  </div>
</div>

<!-- 社交登入彈窗 -->
<div class="social-login-modal" id="socialLoginModal">
  <div class="social-login-content">
    <span class="close-social-modal" id="closeSocialModal">&times;</span>
    <div class="social-login-header">
      <img id="socialLoginLogo" src="/placeholder.svg" alt="Provider Logo" class="social-provider-logo">
      <h2 id="socialLoginTitle">登入</h2>
    </div>
    <div class="social-login-body">
      <form id="socialLoginForm">
        <div class="form-group">
          <label for="socialEmail">電子郵件</label>
          <input type="email" id="socialEmail" class="input-field" required>
        </div>
        <div class="form-group">
          <label for="socialPassword">密碼</label>
          <input type="password" id="socialPassword" class="input-field" required>
        </div>
        <button type="submit" class="social-login-btn">登入</button>
      </form>
    </div>
  </div>
</div>


<script src="signup-script.js"></script>
</body>
</html>
